<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para Ohanna 🤍</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="lluvia-petalos" class="lluvia-petalos" aria-hidden="true"></div>

<main class="login-envoltorio">
  <section class="login-tarjeta">
    <div class="login-doodles" id="doodle-header"></div>

    <h1>Para mi Ohanna</h1>
    <p class="login-sub">Un rinconcito hecho solo para nosotros dos. Inicia sesión con una cuenta creada en Supabase.</p>

    <form id="form-login" autocomplete="off">
      <label for="correo">Correo de tu cuenta de pareja</label>
      <input type="email" id="correo" name="correo" autocomplete="username" placeholder="tu-correo@example.com" required>
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="clave" autocomplete="current-password" placeholder="Contraseña de Supabase" required>
      <button type="submit">Entrar</button>
      <p id="mensaje-error" class="mensaje-error" role="alert" aria-live="polite"></p>
    </form>

    <div class="reproductor">
      <p class="nota-musica">Abre el control 🎵 para elegir una canción y reproducirla</p>
    </div>
  </section>
</main>

<footer class="firma">hecho con todo mi cariño para ti ✿</footer>

<!-- Cargar música de fondo -->
<script type="module" src="js/musica.js"></script>
<script src="js/doodles.js"></script>
<script src="js/petalos.js"></script>
<script>
  document.getElementById('doodle-header').innerHTML = svgPerrito(80) + svgPajarito(36);
  iniciarLluviaDeFlores();

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.currentTarget;
    const boton = form.querySelector('button[type="submit"]');
    const mensaje = document.getElementById('mensaje-error');
    mensaje.textContent = '';
    boton.disabled = true;
    boton.textContent = 'Entrando...';

    try {
      const { supabase } = await import('./js/supabase-config.js');
      const { error } = await supabase.auth.signInWithPassword({
        email: document.getElementById('correo').value.trim(),
        password: document.getElementById('clave').value
      });
      if (error) throw error;
      document.querySelector('.login-tarjeta').classList.add('desvanecer');
      const candidato = new URLSearchParams(location.search).get('return') || 'colage.html';
      const destino = /^[a-z0-9-]+\.html$/i.test(candidato) && candidato !== 'index.html' ? candidato : 'colage.html';
      setTimeout(() => location.replace(destino), 250);
    } catch (error) {
      mensaje.textContent = error.message?.includes('Invalid login credentials')
        ? 'Correo o contraseña incorrectos. Revisa tus datos.'
        : 'No se pudo iniciar sesión. Revisa que la cuenta esté creada y vuelve a intentarlo.';
      boton.disabled = false;
      boton.textContent = 'Entrar';
    }
  });
</script>
<script type="module">
  import { supabase } from './js/supabase-config.js';
  const params = new URLSearchParams(location.search);
  const { data: { session } } = await supabase.auth.getSession();
  if (session && params.get('error') !== 'session') {
    const candidato = params.get('return') || 'colage.html';
    const destino = /^[a-z0-9-]+\.html$/i.test(candidato) && candidato !== 'index.html' ? candidato : 'colage.html';
    location.replace(destino);
  }
</script>
</body>
</html>
