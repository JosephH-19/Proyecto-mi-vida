<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script>document.documentElement.classList.add('sesion-pendiente')</script><title>Diario de nuestra relación</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/espacio.css"><script type="module" src="js/app-shell.js"></script></head>
<body><nav class="nav-hojas"><a href="espacio.html">Nuestro espacio</a><a href="diario.html" class="activa">Diario</a></nav><main class="pagina-espacio"><h1>Diario de nosotros 📔</h1><form id="form-diario" class="form-espacio"><label>Título<input name="titulo" maxlength="160" required placeholder="Un día para recordar"></label><label>Fecha<input name="fecha" type="date" required></label><label>Entrada<textarea name="contenido" rows="6" maxlength="12000" required placeholder="¿Qué quieres guardar de este día?"></textarea></label><button>Guardar en el diario</button><p id="estado-diario" role="status"></p></form><section><h2>Nuestras entradas</h2><div id="entradas-diario" class="lista-espacio">Cargando…</div></section></main><script type="module">
import { supabase } from './js/supabase-config.js';
const form=document.getElementById('form-diario'), lista=document.getElementById('entradas-diario'), estado=document.getElementById('estado-diario');
const {data:{user}}=await supabase.auth.getUser();
async function cargar(){const {data,error}=await supabase.from('diario').select('*').order('fecha',{ascending:false}).order('creado_en',{ascending:false});if(error){lista.textContent='No se pudieron cargar las entradas. Ejecuta database/version1.1.sql en Supabase.';return;}lista.replaceChildren();if(!data.length){lista.textContent='Aún no hay entradas. Escriban la primera.';return;}data.forEach(e=>{const article=document.createElement('article'),h=document.createElement('h3'),small=document.createElement('small'),p=document.createElement('p');h.textContent=e.titulo;small.textContent=`${e.fecha} · ${e.creado_por===user?.id?'Tú':'Tu pareja'}`;p.textContent=e.contenido;article.append(h,small,p);lista.append(article);});}
form.fecha.value=new Date().toISOString().slice(0,10);form.addEventListener('submit',async e=>{e.preventDefault();estado.textContent='Guardando…';const {error}=await supabase.from('diario').insert({titulo:form.titulo.value.trim(),fecha:form.fecha.value,contenido:form.contenido.value.trim(),creado_por:user.id});if(error){estado.textContent='No se pudo guardar. Comprueba que aplicaste la migración v1.1.';return;}form.reset();form.fecha.value=new Date().toISOString().slice(0,10);estado.textContent='Entrada guardada 💛';await cargar();});await cargar();
</script></body></html>
