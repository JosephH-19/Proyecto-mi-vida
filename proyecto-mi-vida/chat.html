<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script>document.documentElement.classList.add('sesion-pendiente')</script><title>Nuestro chat privado</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/espacio.css"><script type="module" src="js/app-shell.js"></script></head>
<body><nav class="nav-hojas"><a href="espacio.html">Nuestro espacio</a><a href="chat.html" class="activa">Chat privado</a></nav><main class="pagina-espacio"><h1>Un mensaje para ti 💌</h1><p>Este chat requiere una sesión iniciada con una cuenta de la pareja.</p><section id="mensajes" class="mensajes-chat" aria-live="polite">Cargando conversación…</section><form id="form-chat" class="form-espacio"><label>Escribe un mensaje<textarea name="contenido" rows="3" maxlength="4000" placeholder="Te estoy pensando…"></textarea></label><div class="acciones-fechas"><button>Enviar mensaje</button><button id="grabar" type="button" class="boton-herramienta">🎙️ Grabar nota de voz</button><button id="detener" type="button" class="boton-herramienta" disabled>Detener</button></div><p id="estado-chat" role="status"></p></form></main><script type="module">
import { supabase } from './js/supabase-config.js';
const mensajes=document.getElementById('mensajes'),form=document.getElementById('form-chat'),estado=document.getElementById('estado-chat'),grabar=document.getElementById('grabar'),detener=document.getElementById('detener');const {data:{user}}=await supabase.auth.getUser();let recorder=null,partes=[];
async function cargar(){const {data,error}=await supabase.from('mensajes_privados').select('*').order('creado_en',{ascending:true}).limit(150);if(error){mensajes.textContent='No se pudo abrir el chat. Ejecuta la migración database/version1.1.sql.';return;}mensajes.replaceChildren();if(!data.length){mensajes.textContent='Todavía no hay mensajes. Deja el primero 💛';return;}for(const msg of data){const item=document.createElement('article');item.className=`burbuja-chat ${msg.creado_por===user.id?'mio':'pareja'}`;const quien=document.createElement('strong');quien.textContent=msg.creado_por===user.id?'Tú':'Tu pareja';const contenido=document.createElement('p');contenido.textContent=msg.contenido||'';const hora=document.createElement('small');hora.textContent=new Date(msg.creado_en).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'});item.append(quien);if(msg.contenido) item.append(contenido);if(msg.audio_path){const audio=document.createElement('audio');audio.controls=true;const {data:archivo}=await supabase.storage.from('mensajes-voz').createSignedUrl(msg.audio_path,3600);if(archivo?.signedUrl)audio.src=archivo.signedUrl;item.append(audio);}item.append(hora);mensajes.append(item);}mensajes.scrollTop=mensajes.scrollHeight;}
form.addEventListener('submit',async e=>{e.preventDefault();const contenido=form.contenido.value.trim();if(!contenido)return;const {error}=await supabase.from('mensajes_privados').insert({contenido,creado_por:user.id});estado.textContent=error?'No se envió. Comprueba la migración v1.1.':'Mensaje enviado 💛';if(!error){form.reset();await cargar();}});
grabar.addEventListener('click',async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const tipo=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,tipo?{mimeType:tipo}:undefined);partes=[];recorder.ondataavailable=e=>{if(e.data.size)partes.push(e.data);};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());estado.textContent='Subiendo nota de voz…';const blob=new Blob(partes,{type:recorder.mimeType||'audio/webm'});if(blob.size>10*1024*1024){estado.textContent='La nota supera el límite de 10 MB. Graba un mensaje más corto.';return;}const ext=blob.type.includes('ogg')?'ogg':blob.type.includes('mp4')?'mp4':'webm';const path=`${user.id}/${crypto.randomUUID()}.${ext}`;const {error:upError}=await supabase.storage.from('mensajes-voz').upload(path,blob,{contentType:blob.type.split(';')[0]});if(upError){estado.textContent='No se pudo subir la voz. Revisa los permisos del bucket mensajes-voz.';return;}const {error}=await supabase.from('mensajes_privados').insert({contenido:'',audio_path:path,creado_por:user.id});estado.textContent=error?'Audio subido pero no se pudo guardar el mensaje.':'Nota de voz enviada 🎙️';await cargar();};recorder.start();grabar.disabled=true;detener.disabled=false;estado.textContent='Grabando…';}catch(error){estado.textContent='No hay acceso al micrófono. Concede permiso al navegador e inténtalo otra vez.';}});
detener.addEventListener('click',()=>{if(recorder?.state==='recording'){recorder.stop();grabar.disabled=false;detener.disabled=true;}});await cargar();supabase.channel('mensajes-privados-v11').on('postgres_changes',{event:'*',schema:'public',table:'mensajes_privados'},cargar).subscribe();
</script></body></html>
