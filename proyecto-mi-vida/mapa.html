<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script>document.documentElement.classList.add('sesion-pendiente')</script><title>Mapa de nuestros recuerdos</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/espacio.css"><script type="module" src="js/app-shell.js"></script></head>
<body><nav class="nav-hojas"><a href="espacio.html">Nuestro espacio</a><a href="mapa.html" class="activa">Mapa de recuerdos</a></nav><main class="pagina-espacio"><h1>Mapa de nuestros recuerdos 📍</h1><p>Al subir una foto, agrega el lugar y sus coordenadas para ponerlo en el mapa.</p><div class="mapa-recuerdos"><iframe id="mapa" title="Mapa OpenStreetMap de un recuerdo" loading="lazy" referrerpolicy="no-referrer" hidden></iframe><p id="estado-mapa" role="status">Cargando recuerdos…</p></div><div id="lugares" class="lista-espacio"></div></main><script type="module">
import { supabase } from './js/supabase-config.js';
const mapa=document.getElementById('mapa'),estado=document.getElementById('estado-mapa'),lista=document.getElementById('lugares');
const {data,error}=await supabase.from('fotos').select('id,titulo,ubicacion,latitud,longitud').not('latitud','is',null).not('longitud','is',null).order('fecha_subida',{ascending:false});
if(error){estado.textContent='No se pudieron leer los lugares. Ejecuta la migración v1.1.';}else if(!data?.length){estado.textContent='Aún no hay coordenadas. Agrégalas en el formulario de subida de fotos.';}else{estado.hidden=true;data.forEach((lugar,i)=>{const boton=document.createElement('button');boton.type='button';boton.className='lugar-mapa';boton.textContent=`📍 ${lugar.ubicacion||lugar.titulo||`Recuerdo ${i+1}`}`;boton.addEventListener('click',()=>{const lat=Number(lugar.latitud),lon=Number(lugar.longitud),delta=.008;mapa.src=`https://www.openstreetmap.org/export/embed.html?bbox=${lon-delta}%2C${lat-delta}%2C${lon+delta}%2C${lat+delta}&layer=mapnik&marker=${lat}%2C${lon}`;mapa.hidden=false;mapa.title=`Mapa de ${lugar.ubicacion||lugar.titulo||'un recuerdo'}`;});lista.append(boton);if(i===0)boton.click();});}
</script></body></html>
