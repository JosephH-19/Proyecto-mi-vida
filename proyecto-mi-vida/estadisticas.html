<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script>document.documentElement.classList.add('sesion-pendiente')</script><title>Nuestra historia en números</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/espacio.css"><script type="module" src="js/app-shell.js"></script></head>
<body><nav class="nav-hojas"><a href="espacio.html">Nuestro espacio</a><a href="estadisticas.html" class="activa">Estadísticas</a></nav><main class="pagina-espacio"><h1>Nuestra historia en números 💞</h1><div id="estadisticas" class="tarjetas-estadistica"><p>Cargando…</p></div><p class="nota-privacidad">Las visitas se contabilizan por cuenta de Supabase. Cada carga de una página privada cuenta como una visita.</p></main><script type="module">
import {supabase} from './js/supabase-config.js';const zona=document.getElementById('estadisticas');const {data:{user}}=await supabase.auth.getUser();const desde=new Date(2025,9,1),dias=Math.max(0,Math.floor((Date.now()-desde.getTime())/86400000));const [{count:fotos,error:eFotos},{data:visitas,error:eVisitas},{count:diario,error:eDiario}]=await Promise.all([supabase.from('fotos').select('id',{count:'exact',head:true}),supabase.from('visitas_privadas').select('usuario_id'),supabase.from('diario').select('id',{count:'exact',head:true})]);zona.replaceChildren();if(eFotos||eVisitas||eDiario){zona.textContent='Ejecuta la migración v1.1 en Supabase para mostrar las estadísticas.';}else{const cuentas=new Map();(visitas||[]).forEach(v=>cuentas.set(v.usuario_id,(cuentas.get(v.usuario_id)||0)+1));const items=[[`${dias} días`,'juntos desde el 1 de octubre de 2025'],[String(fotos||0),'fotos guardadas'],[String(diario||0),'entradas del diario'],[String(cuentas.get(user.id)||0),'visitas tuyas'],[String([...cuentas].filter(([id])=>id!==user.id).reduce((n,[,v])=>n+v,0)),'visitas de tu pareja']];items.forEach(([n,label])=>{const card=document.createElement('article');card.className='estadistica';const strong=document.createElement('strong');strong.textContent=n;const p=document.createElement('p');p.textContent=label;card.append(strong,p);zona.append(card);});}
</script></body></html>
