<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script>document.documentElement.classList.add('sesion-pendiente')</script><title>Fechas especiales</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/espacio.css"><script type="module" src="js/app-shell.js"></script></head>
<body><nav class="nav-hojas"><a href="espacio.html">Nuestro espacio</a><a href="fechas.html" class="activa">Fechas especiales</a></nav><main class="pagina-espacio"><h1>Fechas que guardamos 💝</h1><p>Agrega aniversarios, viajes, primeros momentos y otras fechas especiales.</p><form id="form-fecha" class="form-espacio"><label>Nombre<input name="titulo" maxlength="120" required placeholder="Nuestro primer viaje"></label><label>Fecha<input name="fecha" type="date" required></label><label>Nota<textarea name="descripcion" rows="3" placeholder="Un detalle para recordar"></textarea></label><label class="checkbox"><input name="anual" type="checkbox"> Repetir todos los años</label><button>Guardar fecha</button><p id="estado-fecha" role="status"></p></form><div class="acciones-fechas"><button id="btn-ics" type="button">Descargar calendario (.ics)</button><button id="btn-recordatorios" type="button" class="boton-herramienta">Activar recordatorios del navegador</button></div><div id="lista-fechas" class="lista-espacio">Cargando…</div></main><script type="module">
import { supabase } from './js/supabase-config.js';
const form=document.getElementById('form-fecha'), lista=document.getElementById('lista-fechas'), estado=document.getElementById('estado-fecha');const {data:{user}}=await supabase.auth.getUser();let fechas=[];
function proxima(f){const d=new Date(`${f.fecha}T00:00:00`);if(f.se_repite_anualmente){const h=new Date();d.setFullYear(h.getFullYear());if(d<h)d.setFullYear(h.getFullYear()+1);}return d;}
async function cargar(){let {data,error}=await supabase.from('fechas_especiales').select('*').order('fecha');if(error){lista.textContent='No se pudieron cargar las fechas. Ejecuta database/version1.1.sql en Supabase.';return;}if(!data?.length){const anio=new Date().getFullYear();const iniciales=[{titulo:'Aniversario',fecha:`${anio}-10-01`,descripcion:'El día que comenzó nuestra historia como pareja.',se_repite_anualmente:true,creado_por:user.id},{titulo:'Cumpleaños de Joseph',fecha:`${anio}-01-11`,descripcion:'',se_repite_anualmente:true,creado_por:user.id},{titulo:'Cumpleaños de Ohanna',fecha:`${anio}-10-07`,descripcion:'',se_repite_anualmente:true,creado_por:user.id}];const {error:seedError}=await supabase.from('fechas_especiales').insert(iniciales);if(!seedError){({data,error}=await supabase.from('fechas_especiales').select('*').order('fecha'));}}fechas=data||[];lista.replaceChildren();if(!fechas.length){lista.textContent='Todavía no hay fechas guardadas.';return;}fechas.forEach(f=>{const card=document.createElement('article'),h=document.createElement('h2'),d=document.createElement('p'),p=document.createElement('p');h.textContent=f.titulo;d.textContent=proxima(f).toLocaleDateString('es-PE',{dateStyle:'long'});p.textContent=`${f.descripcion||''}${f.se_repite_anualmente?' · Cada año':''}`;card.append(h,d,p);lista.append(card);});
const hoy=new Date().toDateString();fechas.filter(f=>'Notification'in window&&Notification.permission==='granted'&&proxima(f).toDateString()===hoy).forEach(f=>{const clave=`aviso-${f.id}-${hoy}`;if(Notification.permission==='granted'&&!localStorage.getItem(clave)){new Notification('Una fecha especial 💛',{body:f.titulo});localStorage.setItem(clave,'1');}});}
form.fecha.value=new Date().toISOString().slice(0,10);form.addEventListener('submit',async e=>{e.preventDefault();const {error}=await supabase.from('fechas_especiales').insert({titulo:form.titulo.value.trim(),fecha:form.fecha.value,descripcion:form.descripcion.value.trim(),se_repite_anualmente:form.anual.checked,creado_por:user.id});estado.textContent=error?'No se pudo guardar. Comprueba la migración v1.1.':'Fecha guardada 💛';if(!error){form.reset();await cargar();}});
document.getElementById('btn-recordatorios').addEventListener('click',async()=>{if(!('Notification'in window)){estado.textContent='Este navegador no admite notificaciones.';return;}const permiso=await Notification.requestPermission();estado.textContent=permiso==='granted'?'Recordatorios activados mientras visitas esta página.':'No se concedió permiso para notificaciones.';await cargar();});
document.getElementById('btn-ics').addEventListener('click',()=>{const esc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Proyecto Mi Vida//ES'];fechas.forEach(f=>{lines.push('BEGIN:VEVENT',`UID:${f.id}@proyecto-mi-vida`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}`,`DTSTART;VALUE=DATE:${[proxima(f).getFullYear(),String(proxima(f).getMonth()+1).padStart(2,'0'),String(proxima(f).getDate()).padStart(2,'0')].join('')}`,`SUMMARY:${esc(f.titulo)}`,`DESCRIPTION:${esc(f.descripcion)}`);if(f.se_repite_anualmente)lines.push('RRULE:FREQ=YEARLY');lines.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${esc(f.titulo)}`,'TRIGGER:-P1D','END:VALARM','END:VEVENT');});lines.push('END:VCALENDAR');const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nuestro-calendario.ics';a.click();URL.revokeObjectURL(a.href);});await cargar();
</script></body></html>
